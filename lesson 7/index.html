<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <fieldset>
    <form action="">
     <label for="firstname">First Name:</label><br>
     <input type="text" name="firstname" id="firstname"><br>
<br>

      <label for="lastname">Last Name</label><br>
      <input type="text" name="lastname" id="lastname" disabled><br>
<br>
      <label for="age">Age</label><br>
      <input type="number" name="age" id="age"><br>
<br>
      <label for="password">Password</label><br>
      <input type="text" name="password" id="password" required><br>
<br>
      <label for="email">Email</label><br>
      <input type="text" name="email" id="email"><br>
<br>
      
<br>
      <label for="gender">Gender</label><br>
       <input type="radio" name="gender" id="male" value="male"><br>
       <label for="male">Male</label><br>

      <input type="radio" name="gender" id="female" value="female">
       <label for="female">Female</label><br>
       
      <label>Hobbies:</label><br><br>
      <input type="checkbox" name="gaming" id="gaming" value="gaming">
      <label for="gaming">gaming</label>

      
      <input type="checkbox" name="football" id="football" value="football">
       <label for="football">Football</label><br>

     <select name="pet" id="pet">
      <option value="cat">cat</option>
       <option value="dog">dog</option>
       <option value="iriq">iriq</option>
     </select> <br>
<br> <br>

<textarea name="message" id="message" rows="10" cols="20"></textarea>


                   <input type="submit" name="submit" id="submit"><br><br>







    </form> </fieldset>




</body>
</html>
